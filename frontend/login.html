<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accès - BRPF</title>
  <link rel="icon" href="./src/assets/favicon.svg">
  <link rel="stylesheet" href="./src/style.css">
</head>
<body>

  <main class="auth-wrapper">
    <div class="auth-card">
      <div id="auth-feedback" class="feedback-message"></div>

      <!-- FORMULAIRE DE CONNEXION -->
      <form id="login-form" class="auth-form active">
        <h1 class="auth-title">Connexion</h1>
        <p class="auth-subtitle">Accédez à votre espace pour suivre vos réclamations.</p>

        <div class="form-group">
          <label for="login-email">Adresse email <span class="required">*</span></label>
          <input type="email" id="login-email" required placeholder="nom@exemple.fr">
        </div>

        <div class="form-group">
          <label for="login-password">Mot de passe <span class="required">*</span></label>
          <input type="password" id="login-password" required placeholder="••••••••">
        </div>

        <button type="submit" class="btn-primary">Se connecter</button>

        <p class="auth-switch">
          Pas encore de compte ?
          <a href="#" id="tab-register-btn" class="tab-btn">Créer un compte</a>
        </p>
      </form>

      <!-- FORMULAIRE D'INSCRIPTION -->
      <form id="register-form" class="auth-form">
        <h1 class="auth-title">Créer un compte</h1>
        <p class="auth-subtitle">Rejoignez le BRPF pour déposer vos réclamations.</p>

        <div class="form-row">
          <div class="form-group">
            <label for="reg-firstname">Prénom <span class="required">*</span></label>
            <input type="text" id="reg-firstname" required placeholder="Ex: Bilbo">
          </div>

          <div class="form-group">
            <label for="reg-lastname">Nom <span class="required">*</span></label>
            <input type="text" id="reg-lastname" required placeholder="Ex: Sacquet">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="reg-email">Adresse email <span class="required">*</span></label>
            <input type="email" id="reg-email" required placeholder="bilbo@lacomte.fr">
          </div>

          <div class="form-group">
            <label for="reg-password">Mot de passe <span class="required">*</span></label>
            <input type="password" id="reg-password" required minlength="6" placeholder="Au moins 6 caractères">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="reg-work">Œuvre / Univers d'origine</label>
            <input type="text" id="reg-work" placeholder="Ex: Le Seigneur des Anneaux">
          </div>

          <div class="form-group">
            <label for="reg-work-year">Date de l'œuvre d'origine</label>
            <select id="reg-work-year">
              <option value="" disabled selected>Sélectionnez une année</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="reg-role">Rôle du personnage</label>
          <select id="reg-role">
            <option value="">-- Sélectionnez un rôle --</option>
          </select>
        </div>

        <button type="submit" class="btn-primary">S'inscrire</button>

        <p class="auth-switch">
          Vous avez déjà un compte ?
          <a href="#" id="tab-login-btn" class="tab-btn">Se connecter</a>
        </p>
      </form>
    </div>
  </main>

  <script type="module" src="src/js/login.js"></script>
</body>
</html>
