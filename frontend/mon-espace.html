<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BRPF - Mon espace</title>
  <link rel="icon" href="./src/assets/favicon.svg">
  <link rel="stylesheet" href="./src/style.css">
</head>
<body>

  <!-- Header (rempli par src/components/header.js) -->
  <div id="header-container"></div>

  <!-- Profil -->
  <section class="profile">
    <div class="profile-header">
      <div class="profile-identity">
        <div class="profile-avatar">
          <img src="./src/assets/avatar-placeholder.svg" alt="Avatar du personnage connecté">
        </div>
        <div>
          <h1 id="profile-name">Mon espace</h1>
          <p id="profile-subtitle" class="profile-subtitle">Personnage connecté</p>
        </div>
      </div>
      <p class="profile-description">Retrouvez ici le suivi de toutes vos réclamations, triées par statut.</p>

      <div class="claims-filter">
        <label for="status-filter">Filtrer par statut</label>
        <select id="status-filter">
          <option value="all">Toutes les réclamations</option>
          <option value="pending">En cours</option>
          <option value="accepted">Acceptées</option>
          <option value="rejected">Refusées</option>
          <option value="invalid">Invalides</option>
        </select>
      </div>
    </div>

    <div id="claims-container">
      <p id="claims-feedback" class="feedback-message">Chargement de vos réclamations...</p>
    </div>
  </section>

  <!-- Footer (rempli par src/components/footer.js) -->
  <div id="footer-container"></div>

  <script type="module">
    import { renderHeader, initHeaderEvents } from './src/components/header.js';
    import { renderFooter } from './src/components/footer.js';
    import { requireAuth } from './src/utils/guard.js';
    import { AuthService } from './src/services/auth.service.js';
    import { ClaimsService } from './src/services/claims.service.js';

    if (!requireAuth()) throw new Error('Authentification requise.');

    document.getElementById('header-container').innerHTML = renderHeader();
    initHeaderEvents();

    document.getElementById('footer-container').innerHTML = renderFooter();

    const statusLabels = {
      pending: 'En cours',
      accepted: 'Acceptées',
      rejected: 'Refusées',
      invalid: 'Invalides'
    };

    function getStatusKey(status) {
      const normalizedStatus = status.toLowerCase();
      if (normalizedStatus.includes('accept')) return 'accepted';
      if (normalizedStatus.includes('refus')) return 'rejected';
      if (normalizedStatus.includes('invalid')) return 'invalid';
      return 'pending';
    }

    function renderClaim(claim) {
      const statusKey = getStatusKey(claim.status || '');
      const article = document.createElement('article');
      article.className = 'claim-card';
      article.dataset.status = statusKey;

      const role = claim.character_role
        ? `<span class="claim-tag">${claim.character_role}</span>`
        : '';
      const response = claim.response
        ? `<div class="claim-justification"><p class="claim-justification-label">Réponse</p><p class="claim-justification-text"></p></div>`
        : '';

      article.innerHTML = `
        <div class="claim-card-header">
          <h3></h3>
          <span class="status-badge status-${statusKey}">${statusLabels[statusKey]}</span>
        </div>
        <div class="claim-tags">${role}</div>
        <p class="claim-ref">Réf. ${claim.id}</p>
        ${response}
      `;
      article.querySelector('h3').textContent = claim.name;
      if (claim.response) article.querySelector('.claim-justification-text').textContent = claim.response;
      return article;
    }

    function renderClaims(claims) {
      const container = document.getElementById('claims-container');
      container.innerHTML = '';

      const groupedClaims = { pending: [], accepted: [], rejected: [], invalid: [] };
      claims.forEach(claim => groupedClaims[getStatusKey(claim.status)].push(claim));

      Object.entries(groupedClaims).forEach(([statusKey, statusClaims]) => {
        const section = document.createElement('div');
        section.className = 'claims-section';
        section.dataset.status = statusKey;
        section.innerHTML = `<h2>${statusLabels[statusKey]}</h2><div class="claims-list"></div>`;
        const list = section.querySelector('.claims-list');

        if (statusClaims.length === 0) {
          list.innerHTML = '<p class="claims-empty">Aucune réclamation dans cette catégorie.</p>';
        } else {
          statusClaims.forEach(claim => list.appendChild(renderClaim(claim)));
        }
        container.appendChild(section);
      });
    }

    async function loadSpace() {
      const profile = await AuthService.getProfile();
      if (profile) {
        document.getElementById('profile-name').textContent = `${profile.name || ''} ${profile.surname || ''}`.trim() || 'Mon espace';
        document.getElementById('profile-subtitle').textContent = profile.character_role || 'Personnage connecté';
      }

      try {
        renderClaims(await ClaimsService.getUserClaims());
      } catch (error) {
        document.getElementById('claims-feedback').textContent = error.message;
      }
    }

    document.getElementById('status-filter').addEventListener('change', (event) => {
      document.querySelectorAll('.claims-section').forEach(section => {
        section.hidden = event.target.value !== 'all' && section.dataset.status !== event.target.value;
      });
    });

    loadSpace();
  </script>

</body>
</html>
