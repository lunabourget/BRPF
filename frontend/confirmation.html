<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BRPF - Réclamation envoyée</title>
  <link rel="icon" href="./src/assets/favicon.svg">
  <link rel="stylesheet" href="./src/style.css">
</head>
<body>

  <!-- Header (rempli par src/components/header.js) -->
  <div id="header-container"></div>

  <!-- Hero -->
  <section class="hero hero--center">
    <div class="hero-text">
      <div class="confirmation-icon" aria-hidden="true">&#10003;</div>
      <h1>Réclamation envoyée !</h1>
      <p>
        Votre réclamation a bien été enregistrée. Notre équipe va l'étudier avec sérieux, respect et cohérence.
      </p>

      <article class="claim-card confirmation-summary" id="confirmation-summary" hidden>
        <div class="claim-card-header">
          <h3 id="confirmation-work"></h3>
          <span class="status-badge status-pending">En cours</span>
        </div>
        <p class="confirmation-character" id="confirmation-character"></p>
        <div class="claim-tags" id="confirmation-tags"></div>
        <p class="claim-ref" id="confirmation-ref-value"></p>
      </article>

      <div class="confirmation-actions">
        <a href="mon-espace.html" class="btn-primary">Voir mes réclamations</a>
        <a href="home.html" class="btn-secondary">Retour à l'accueil</a>
      </div>
    </div>
  </section>

  <!-- Footer (rempli par src/components/footer.js) -->
  <div id="footer-container"></div>

  <script type="module">
    import { renderHeader, initHeaderEvents } from './src/components/header.js';
    import { renderFooter } from './src/components/footer.js';

    document.getElementById('header-container').innerHTML = renderHeader();
    initHeaderEvents();

    document.getElementById('footer-container').innerHTML = renderFooter();
  </script>

  <script>
    const params = new URLSearchParams(window.location.search);
    const ref = params.get('ref');
    const claimName = params.get('name');
    const character = params.get('character');
    const work = params.get('work');
    const year = params.get('year');
    const tags = params.get('tags');
    const description = params.get('description');

    if (!ref) {
      window.location.href = 'formulaire.html';
    } else {
      document.getElementById('confirmation-summary').hidden = false;
      document.getElementById('confirmation-work').textContent = claimName || 'Réclamation sans titre';

      const characterEl = document.getElementById('confirmation-character');
      if (character) {
        characterEl.textContent = 'Personnage : ' + character;
      } else {
        characterEl.hidden = true;
      }

      document.getElementById('confirmation-ref-value').textContent = 'Réf. #' + ref;

      const tagsContainer = document.getElementById('confirmation-tags');
      if (tags) {
        tags.split(',').forEach((tag) => {
          const span = document.createElement('span');
          span.className = 'claim-tag';
          span.textContent = tag;
          tagsContainer.appendChild(span);
        });
      }

    }
  </script>

</body>
</html>
